# The test suite runs with the development credentials, because application.yml deliberately
# gives none of them a default and an unresolvable placeholder fails a @SpringBootTest exactly
# as it fails a deployment - which is the behaviour worth having, in the place it is worth
# having it.
#
# A .properties file beside main's application.yml rather than a second application.yml, which
# would replace the main one on the classpath and take the entire configuration with it. This
# sets one key that the main file does not set at all, so there is nothing to resolve between
# them; the values themselves come from application-dev.yml, where profile-specific documents
# outrank everything non-profile-specific whatever their location.
spring.profiles.active=dev
