# The test suite runs with the development credentials, because application.yml deliberately
# gives none of them a default and an unresolvable placeholder fails a @SpringBootTest exactly
# as it fails a deployment - which is the behaviour worth having, in the place it is worth
# having it.
#
# A .properties file beside main's application.yml rather than a second application.yml, which
# would replace the main one on the classpath and take the entire configuration with it. This
# sets one key that the main file does not set at all, so there is nothing to resolve between
# them; the values themselves come from application-dev.yml, where profile-specific documents
# outrank everything non-profile-specific whatever their location.
spring.profiles.active=dev
app.search.scheduled=false

# Present, so that @ConditionalOnProperty switches the indexer on. The value is a placeholder
# and is never used: TestcontainersConfiguration's DynamicPropertyRegistrar replaces it with the
# container's real address, at a higher precedence, before any bean reads it.
#
# It has to be here rather than only in the registrar because the two happen in the wrong order
# for a condition - a registrar contributes properties during refresh, and a condition on a
# scanned component is evaluated while configuration is parsed, before that. Until the main
# application.yml stopped defaulting this key to an empty string, the empty default was what
# made the condition pass and this was invisible.
app.search.uri=http://search.invalid:9200
