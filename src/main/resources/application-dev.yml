# Every credential this application needs, and the only place any of them has a value that is
# written down.
#
# The main application.yml names these with no fallback - `${JWT_SECRET}`, not
# `${JWT_SECRET:something}` - so the application cannot start without them. That is the whole
# point of this file existing: a default in the main file is a value a deployment inherits by
# forgetting, and forgetting here is not a small mistake. Ticket codes are a random lookup plus
# a MAC under `ticket-code-key`, so a deployment that kept the development key would issue
# tickets anybody holding this repository could mint. The same argument is weaker but the same
# shape for the other four.
#
# Nothing here is secret. They are published, in git, on purpose - that is what makes them safe
# to use locally and unusable anywhere else.
#
# Active by default for `./mvnw spring-boot:run` (configured in pom.xml) and for the test suite
# (src/test/resources/application.properties), so a clone still runs with no setup. A container
# does not get this profile and must supply the environment instead.
spring:
  data:
    mongodb:
      # No credentials, and that is a real difference worth noticing rather than a
      # simplification. `mongod` started without --auth accepts anybody, where Postgres
      # demanded a password even locally. The development database is therefore open by
      # default, which is exactly the shape of mistake that reaches a deployment.
      uri: mongodb://localhost:27017/eventticket

app:
  security:
    jwt-secret: dev-only-secret-not-for-any-deployed-environment-0123456789
  storage:
    # The compose.yaml MinIO root credentials.
    access-key: eventticket
    secret-key: eventticket
  tickets:
    keys:
      1: dev-only-ticket-code-key-not-for-any-deployed-environment
  payment:
    fake:
      secret: fake-provider-shared-secret
