spring:
  application:
    name: event-ticket-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/eventticket}
    username: ${DATABASE_USERNAME:eventticket}
    # No default, deliberately. Every credential in this file is written the same way: the
    # value lives in application-dev.yml and nowhere else, so an application started without
    # the environment variable refuses to boot instead of quietly using a published one.
    password: ${DATABASE_PASSWORD}
  jpa:
    open-in-view: false          # no lazy loading in the web layer; use cases own their transactions
    hibernate:
      ddl-auto: validate         # Flyway owns the schema, never Hibernate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    # Absent means there is no mail server, exactly as an absent Stripe key means there is no
    # Stripe: an unconfigured deployment writes its mail to the log rather than failing on the
    # first person who registers, and a fresh clone and the whole suite need no account. Boot
    # creates a JavaMailSender only when `host` is set, which is the switch
    # EmailTransportConfiguration reads.
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    # A credential, and written the same way as Stripe's rather than as JWT_SECRET's: mail is
    # optional, so requiring this would stop an application that never intended to send any.
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:true}
      # Without a timeout the default is none at all, and a mail host that accepts a
      # connection and never answers holds the dispatcher's thread until the process is
      # restarted - one unreachable server stopping every other message rather than one.
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

server:
  port: 8080
  servlet:
    # The contract's paths are relative to /api/v1, and the generated interfaces map the
    # paths as written. Setting it here keeps the two in step.
    context-path: /api/v1

app:
  # Where a browser reaches this application. Every link this system emails is built from it -
  # address verification, a ticket, a refund notice - so a deployment that leaves it at the
  # development default sends every recipient to a port on their own machine.
  base-url: ${APP_BASE_URL:http://localhost:5173}
  # The only way to become a platform admin, and the only privilege no request can grant.
  # The endpoint it unlocks decides who may sell tickets at all, so conferring it needs
  # access to the deployment rather than to the application. Comma-separated; an account
  # named here is promoted when it registers, and at startup if it registered already.
  platform-admin-emails: ${PLATFORM_ADMIN_EMAILS:}
  security:
    issuer: event-ticket
    jwt-secret: ${JWT_SECRET}
  checkout:
    # requirements/004 criterion 5. The buyer is shown this counting down.
    hold-window: PT10M
    expiry-sweep: PT1M
  pricing:
    # requirements/003 criterion 3: a price is free, or one somebody can actually be charged.
    # Deliberately above the payment provider's own floor - Stripe refuses below roughly
    # 12.500 VND today, and that number is denominated in dollars, so a limit tracking a
    # foreign currency will eventually cross one that does not. Configuration rather than a
    # constant: the provider's floor is theirs, and this market's idea of a real ticket price
    # is not ours.
    minimum-amount: ${MINIMUM_TICKET_PRICE:20000}
  email:
    retry-interval: PT1M
    # Who the mail is from, which is not necessarily who it logs in as: a provider may permit
    # sending as an alias, and a login is not always an address. Empty falls back to the login,
    # which is the common case and what a personal Gmail account requires anyway.
    from: ${MAIL_FROM:}
  storage:
    # Object storage for cover images (ADR-0006). Locally this is the MinIO container in
    # compose.yaml; deployed, the endpoint is left empty and the SDK resolves AWS itself.
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    region: ${STORAGE_REGION:ap-southeast-1}
    bucket: ${STORAGE_BUCKET:event-ticket-covers}
    access-key: ${STORAGE_ACCESS_KEY}
    secret-key: ${STORAGE_SECRET_KEY}
    # Where a browser fetches a cover from. Separate from `endpoint` because they stop being
    # the same address the moment anything is put in front of the bucket, and because the
    # application talks to storage over the container network while a browser does not.
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:http://localhost:9000/event-ticket-covers}
    # Where a browser POSTs an upload. A third address, because the three are genuinely
    # different things and only look alike on a laptop, where all of them are localhost:
    # `endpoint` is how this application reaches the store and may be a name only the
    # container network resolves; `public-base-url` may be a CDN, which can serve a cover
    # and cannot accept one; and this is the bucket itself, reachable from a browser.
    # Empty falls back to `endpoint`, which is what keeps `docker compose up` and a local
    # run identical.
    upload-base-url: ${STORAGE_UPLOAD_BASE_URL:}
    # nfr.md: five megabytes is generous for a poster and small enough that no resizing
    # pipeline is warranted. Signed into the upload, so the store refuses a larger one.
    max-bytes: 5242880
    upload-validity: PT10M
  tickets:
    # Version to secret. Every version listed is accepted at the door; only the current one is
    # issued, which is how a key can be rotated without invalidating tickets already sold.
    # Losing every key here makes every outstanding ticket unverifiable - a heavier failure
    # than losing the JWT secret, which only forces people to sign in again.
    current-key-version: 1
    keys:
      1: ${TICKET_CODE_KEY}
  admission:
    # Generous on purpose: a scanner reads QR codes continuously, so a camera resting on one
    # code fires the same scan many times a second. The door failing because somebody held
    # their phone still would be worse than the abuse this prevents.
    scans-per-second: 5
    burst: 30
  payment:
    fake:
      secret: ${FAKE_PAYMENT_SECRET}
    stripe:
      # No default, and the provider bean is conditional on it. Unset means there is no STRIPE
      # provider at all rather than one that fails on first use - which is what keeps a fresh
      # clone and the whole test suite working with no account and no network.
      #
      # The webhook secret comes from `stripe listen`, not from the dashboard: Stripe cannot
      # reach a laptop, so the CLI receives the event and forwards it, signing with its own.
      secret-key: ${STRIPE_SECRET_KEY:}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}

logging:
  pattern:
    # Every line carries the request id, and the user and tenant once known.
    level: "%5p [req=%X{requestId:-} user=%X{userId:-} org=%X{organizationId:-}]"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    mail:
      # Off, and this is a decision rather than noise reduction.
      #
      # Adding the mail starter also brings a health indicator that opens an SMTP connection,
      # and Boot treats an *empty* `spring.mail.host` as present - so a deployment that
      # declares MAIL_HOST and leaves it blank, which is the ordinary compose case, gets a
      # sender aimed at localhost:587 and an application that reports DOWN. Everything works;
      # the health check says otherwise, and `depends_on: service_healthy` then keeps the
      # frontend from ever starting. That is a whole deployment refusing to boot over a
      # variable that means "we do not send mail".
      #
      # It is wrong in the configured case too. A ticketing platform whose mail provider is
      # briefly unreachable is not down: `OutboxEmailSender` has already committed the row
      # and `DispatchPendingEmails` retries five times. Reporting DOWN there asks an
      # orchestrator to restart or drain a container that is selling tickets perfectly well,
      # because Gmail hiccupped.
      #
      # What mail is doing is visible where it belongs - the `email_delivery` table records
      # every attempt, its error and its status, which answers "did this person hear from us"
      # far better than a liveness probe can.
      enabled: false
