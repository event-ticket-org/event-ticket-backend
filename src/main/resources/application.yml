spring:
  application:
    name: event-ticket-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/eventticket
    username: eventticket
    password: eventticket
  jpa:
    open-in-view: false          # no lazy loading in the web layer; use cases own their transactions
    hibernate:
      ddl-auto: validate         # Flyway owns the schema, never Hibernate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  servlet:
    # The contract's paths are relative to /api/v1, and the generated interfaces map the
    # paths as written. Setting it here keeps the two in step.
    context-path: /api/v1

app:
  base-url: http://localhost:5173
  # The only way to become a platform admin, and the only privilege no request can grant.
  # The endpoint it unlocks decides who may sell tickets at all, so conferring it needs
  # access to the deployment rather than to the application. Comma-separated; an account
  # named here is promoted when it registers, and at startup if it registered already.
  platform-admin-emails: ${PLATFORM_ADMIN_EMAILS:}
  security:
    issuer: event-ticket
    # Development only. Staging and production supply this through the environment;
    # a checked-in secret is a development convenience and nothing more.
    jwt-secret: ${JWT_SECRET:dev-only-secret-not-for-any-deployed-environment-0123456789}
  checkout:
    # requirements/004 criterion 5. The buyer is shown this counting down.
    hold-window: PT10M
    expiry-sweep: PT1M
  email:
    retry-interval: PT1M
  storage:
    # Object storage for cover images (ADR-0006). Locally this is the MinIO container in
    # compose.yaml; deployed, the endpoint is left empty and the SDK resolves AWS itself.
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    region: ${STORAGE_REGION:ap-southeast-1}
    bucket: ${STORAGE_BUCKET:event-ticket-covers}
    access-key: ${STORAGE_ACCESS_KEY:eventticket}
    secret-key: ${STORAGE_SECRET_KEY:eventticket}
    # Where a browser fetches a cover from. Separate from `endpoint` because they stop being
    # the same address the moment anything is put in front of the bucket, and because the
    # application talks to storage over the container network while a browser does not.
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:http://localhost:9000/event-ticket-covers}
    # nfr.md: five megabytes is generous for a poster and small enough that no resizing
    # pipeline is warranted. Signed into the upload, so the store refuses a larger one.
    max-bytes: 5242880
    upload-validity: PT10M
  tickets:
    # Version to secret. Every version listed is accepted at the door; only the current one is
    # issued, which is how a key can be rotated without invalidating tickets already sold.
    # Losing every key here makes every outstanding ticket unverifiable - a heavier failure
    # than losing the JWT secret, which only forces people to sign in again.
    current-key-version: 1
    keys:
      1: ${TICKET_CODE_KEY:dev-only-ticket-code-key-not-for-any-deployed-environment}
  admission:
    # Generous on purpose: a scanner reads QR codes continuously, so a camera resting on one
    # code fires the same scan many times a second. The door failing because somebody held
    # their phone still would be worse than the abuse this prevents.
    scans-per-second: 5
    burst: 30
  payment:
    fake:
      secret: ${FAKE_PAYMENT_SECRET:fake-provider-shared-secret}

logging:
  pattern:
    # Every line carries the request id, and the user and tenant once known.
    level: "%5p [req=%X{requestId:-} user=%X{userId:-} org=%X{organizationId:-}]"

management:
  endpoints:
    web:
      exposure:
        include: health,info
