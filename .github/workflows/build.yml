name: Build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: Compile and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Testcontainers needs a Docker daemon; ubuntu-latest runners have one.
      # The contract is generated from contracts/openapi.yaml during compile, so a spec
      # the server no longer matches fails here rather than in production.
      - name: Test
        run: ./mvnw --batch-mode verify
