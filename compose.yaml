services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: eventticket
      POSTGRES_USER: eventticket
      POSTGRES_PASSWORD: eventticket
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventticket"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
