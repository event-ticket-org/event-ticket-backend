services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: eventticket
      POSTGRES_USER: eventticket
      POSTGRES_PASSWORD: eventticket
      # Pinned, not left to the image.
      #
      # Postgres 18 moved the default data directory from /var/lib/postgresql/data to
      # /var/lib/postgresql/18/docker, and the image declares VOLUME /var/lib/postgresql.
      # A compose file written for 17 therefore keeps working and quietly stops persisting:
      # the named volume below is mounted somewhere the server never writes, the real
      # cluster lands in an anonymous volume, and `docker compose down` throws it away.
      #
      # Worse, that anonymous volume is re-attached on every recreate, so a cluster
      # initialised once without these credentials keeps coming back and authentication
      # fails with no clue as to why.
      PGDATA: /var/lib/postgresql/data
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # -d as well as -U: pg_isready answers "accepting connections" for a server that has
      # no such role and no such database, which makes a green healthcheck mean very little.
      test: ["CMD-SHELL", "pg_isready -U eventticket -d eventticket"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Object storage for Event cover images (ADR-0006). A container beside the database rather
  # than an AWS account, so that "clone it and run it" stays true - which is worth more than
  # the container costs.
  #
  # SeaweedFS rather than MinIO: the MinIO community edition was archived in April 2026 and its
  # Docker Hub repository withdrawn, which is what broke CI - every `minio/minio` tag, pinned
  # ones included, became unpullable at once and only a warm local cache hid it.
  seaweedfs:
    image: chrislusf/seaweedfs:4.46
    # `server` runs the master, a volume server, the filer and the S3 gateway in one process.
    # The gateway is put on 9000 so the store keeps the address everything already knows.
    command: >
      server -dir=/data -s3 -s3.port=9000
      -s3.config=/etc/seaweedfs/s3-identities.json
      -master.volumeSizeLimitMB=64
    ports:
      - "9000:9000"
      # The filer, which browses what actually landed in a bucket - the job MinIO's console did.
      - "8888:8888"
    volumes:
      - seaweeddata:/data
      # Credentials, and the public-read grant, in one file. There is no root user to set by
      # environment: SeaweedFS refuses every request until an identity says otherwise, so an
      # unreadable or missing file is a store that rejects the application rather than one that
      # lets the world write to it. That failure direction is the reason to prefer the file.
      - ./docker/storage/s3-identities.json:/etc/seaweedfs/s3-identities.json:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9000/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Creates the bucket and expires abandoned uploads, then exits.
  #
  # What it no longer has to do is grant public read. A cover is served straight to a browser on
  # a public page, so the objects have to be readable by anyone - but only the objects, and only
  # in this bucket. `Read:event-ticket-covers` in the identity file is exactly that: Read is not
  # List in SeaweedFS, so there is no equivalent of `mc anonymous set download` quietly granting
  # ListBucket alongside GetObject. That matters because the keys carry organization and event
  # ids, so a listable bucket publishes which organizations exist and how many events each has,
  # drafts and unlisted ones included. Verified by asking: anonymous GET of a cover answers 200,
  # anonymous list of the same bucket answers 403.
  seaweedfs-init:
    image: chrislusf/seaweedfs:4.46
    depends_on:
      seaweedfs:
        condition: service_healthy
    # `weed shell` speaks to the master, not the S3 API, which is why this needs the image and
    # not an S3 client.
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "s3.bucket.create -name event-ticket-covers" | weed shell -master=seaweedfs:9333
        echo "fs.configure -locationPrefix=/buckets/event-ticket-covers/pending/ -ttl=1d -apply" \
          | weed shell -master=seaweedfs:9333

volumes:
  pgdata:
  seaweeddata:
