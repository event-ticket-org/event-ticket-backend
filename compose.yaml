services:
  mongo:
    image: mongo:8.0
    # --replSet is not optional, and the failure it prevents is quiet.
    #
    # MongoDB implements transactions on the oplog, and a standalone mongod has none - it does
    # not run them slowly, it refuses them outright with "Transaction numbers are only allowed
    # on a replica set member". ConfirmPayment needs one, so without this the application
    # starts cleanly, serves most of the API, and fails only when somebody pays.
    #
    # A replica set of one is still a replica set. This is the smallest configuration that can
    # begin a transaction at all, which is a deployment constraint Postgres never had: a single
    # Postgres has been able to BEGIN since before replication existed.
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      # Initiates the set on the first run and is a no-op afterwards, so the healthcheck is
      # also the bootstrap. `hello().isWritablePrimary` rather than a ping: a member that has
      # been initiated but has not yet elected itself answers a ping perfectly well and cannot
      # take a write, which is the same shape of hollow green light that `pg_isready -U` was.
      test: >
        mongosh --quiet --eval "
          try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}) };
          quit(db.hello().isWritablePrimary ? 0 : 1)"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Object storage for Event cover images (ADR-0006). A container beside the database rather
  # than an AWS account, so that "clone it and run it" stays true - which is worth more than
  # the container costs.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: eventticket
      MINIO_ROOT_PASSWORD: eventticket
    ports:
      - "9000:9000"
      # The browser console, which is the quickest way to see what actually landed in a bucket.
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Creates the bucket and makes its objects readable, then exits. A cover is served straight
  # to a browser on a public page, so the objects have to be public - but only the objects.
  #
  # Not `mc anonymous set download`, which is the obvious command and grants ListBucket along
  # with GetObject. That would let anybody enumerate every cover in the bucket, and the keys
  # carry organization and event ids - so a listable bucket publishes which organizations
  # exist and how many events each has, including the drafts and the unlisted ones. An
  # explicit policy grants the one action that serving a picture needs.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    # A list and a block scalar, not `sh -c "..."`: the policy is JSON, JSON is full of
    # double quotes, and every one of them would close the shell string it was written in.
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 eventticket eventticket
        mc mb --ignore-existing local/event-ticket-covers
        cat > /tmp/public-read.json <<'JSON'
        {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"AWS":["*"]},"Action":["s3:GetObject"],"Resource":["arn:aws:s3:::event-ticket-covers/*"]}]}
        JSON
        mc anonymous set-json /tmp/public-read.json local/event-ticket-covers
        mc ilm rule add --expire-days 1 --prefix pending/ local/event-ticket-covers || true

volumes:
  mongodata:
  miniodata:
