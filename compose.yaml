services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: eventticket
      POSTGRES_USER: eventticket
      POSTGRES_PASSWORD: eventticket
      # Pinned, not left to the image.
      #
      # Postgres 18 moved the default data directory from /var/lib/postgresql/data to
      # /var/lib/postgresql/18/docker, and the image declares VOLUME /var/lib/postgresql.
      # A compose file written for 17 therefore keeps working and quietly stops persisting:
      # the named volume below is mounted somewhere the server never writes, the real
      # cluster lands in an anonymous volume, and `docker compose down` throws it away.
      #
      # Worse, that anonymous volume is re-attached on every recreate, so a cluster
      # initialised once without these credentials keeps coming back and authentication
      # fails with no clue as to why.
      PGDATA: /var/lib/postgresql/data
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # -d as well as -U: pg_isready answers "accepting connections" for a server that has
      # no such role and no such database, which makes a green healthcheck mean very little.
      test: ["CMD-SHELL", "pg_isready -U eventticket -d eventticket"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Object storage for Event cover images (ADR-0006). A container beside the database rather
  # than an AWS account, so that "clone it and run it" stays true - which is worth more than
  # the container costs.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: eventticket
      MINIO_ROOT_PASSWORD: eventticket
    ports:
      - "9000:9000"
      # The browser console, which is the quickest way to see what actually landed in a bucket.
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Creates the bucket and makes its objects readable, then exits. A cover is served straight
  # to a browser on a public page, so the objects have to be public - but only the objects.
  #
  # Not `mc anonymous set download`, which is the obvious command and grants ListBucket along
  # with GetObject. That would let anybody enumerate every cover in the bucket, and the keys
  # carry organization and event ids - so a listable bucket publishes which organizations
  # exist and how many events each has, including the drafts and the unlisted ones. An
  # explicit policy grants the one action that serving a picture needs.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    # A list and a block scalar, not `sh -c "..."`: the policy is JSON, JSON is full of
    # double quotes, and every one of them would close the shell string it was written in.
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 eventticket eventticket
        mc mb --ignore-existing local/event-ticket-covers
        cat > /tmp/public-read.json <<'JSON'
        {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"AWS":["*"]},"Action":["s3:GetObject"],"Resource":["arn:aws:s3:::event-ticket-covers/*"]}]}
        JSON
        mc anonymous set-json /tmp/public-read.json local/event-ticket-covers
        mc ilm rule add --expire-days 1 --prefix pending/ local/event-ticket-covers || true

volumes:
  pgdata:
  miniodata:
