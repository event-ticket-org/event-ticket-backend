openapi: 3.1.0
info:
  title: Event Ticketing API
  version: 1.0.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: |
    Normative contract for the Event Ticketing platform. Hand-written; the server is built
    to match this document, not generated from it (ADR-0003).

    **Organization scoping.** The active Organization is resolved from the access token and
    never appears in a path. Switching organizations reissues the token. Putting an
    organization id in a URL invites the exact bug row-level security exists to prevent
    (ADR-0004).

    **Money.** Amounts are integers in the currency's smallest unit. VND has no minor unit
    (ISO 4217 exponent 0), so `100000` is one hundred thousand dong.

    **Time.** All instants are RFC 3339 in UTC. Clients render in the Venue's timezone.
servers:
  - url: /api/v1
    description: Relative to the deployment host

tags:
  - name: Auth
  - name: Organization
  - name: Platform admin
  - name: Venues
  - name: Events
  - name: Public
  - name: Checkout
  - name: Tickets
  - name: Admission
  - name: Refunds
  - name: Webhooks

security:
  - bearerAuth: []

paths:
  /auth/register:
    post:
      tags: [Auth]
      security: []
      summary: Register an account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '202': { description: Registered; a verification email has been sent }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Invalid' }

  /auth/verify-email:
    post:
      tags: [Auth]
      security: []
      summary: Verify an email address
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyEmailRequest' }
      responses:
        '200': { $ref: '#/components/responses/Tokens' }
        '410': { description: Verification token expired or already used }

  /auth/forgot-password:
    post:
      tags: [Auth]
      security: []
      summary: Ask for a password reset link
      description: >
        Always 202, whether or not the address has an account (requirements/001 criterion 17).
        The form is public, so an answer that distinguished the two cases would report who has
        an account here.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ForgotPasswordRequest' }
      responses:
        '202': { description: 'If that address has an account, a reset link has been sent' }
        '422': { $ref: '#/components/responses/Invalid' }

  /auth/reset-password:
    post:
      tags: [Auth]
      security: []
      summary: Set a new password from a reset link
      description: >
        Sets the password, marks the address verified, and ends every other session
        (requirements/001 criteria 18 and 19). Answers with tokens, because whoever followed
        the link has just proved they own the address and is not asked to prove it again.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordRequest' }
      responses:
        '200': { $ref: '#/components/responses/Tokens' }
        '410': { description: 'Reset link expired, already used, or superseded by a newer one' }
        '422': { $ref: '#/components/responses/Invalid' }

  /auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Sign in
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200': { $ref: '#/components/responses/Tokens' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/refresh:
    post:
      tags: [Auth]
      security: []
      summary: Exchange a refresh token for a new access token
      description: |
        Refresh tokens are stored server-side and revocable. Revocation of a Membership or a
        Role change takes effect here, within the access token's 15-minute lifetime
        (ADR-0005).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200': { $ref: '#/components/responses/Tokens' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current refresh token
      responses:
        '4XX': { $ref: '#/components/responses/Error4xx' }
        '204': { description: Signed out }

  /auth/switch-organization:
    post:
      tags: [Auth]
      summary: Change the active Organization and reissue tokens
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SwitchOrganizationRequest' }
      responses:
        '200': { $ref: '#/components/responses/Tokens' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /me:
    get:
      tags: [Auth]
      summary: The signed-in User and their Memberships
      responses:
        '4XX': { $ref: '#/components/responses/Error4xx' }
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }

  /organizations:
    post:
      tags: [Organization]
      summary: Create an Organization; the caller becomes its Owner
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrganizationRequest' }
      responses:
        '201':
          description: Created, pending approval
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organization' }
        '403':
          description: Caller's email is not verified
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /organization/members:
    get:
      tags: [Organization]
      summary: List Memberships of the active Organization
      responses:
        '4XX': { $ref: '#/components/responses/Error4xx' }
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Membership' }
    post:
      tags: [Organization]
      summary: Invite a User by email address
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InviteMemberRequest' }
      responses:
        '201':
          description: Invited
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Membership' }
        '409': { $ref: '#/components/responses/Conflict' }

  /organization/members/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Organization]
      summary: Change a Member's Role
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangeMemberRoleRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Membership' }
        '409':
          description: Would leave the Organization without an Owner
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    delete:
      tags: [Organization]
      summary: Remove a Member
      responses:
        '204': { description: Removed }
        '409':
          description: Would leave the Organization without an Owner
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /admin/organizations:
    get:
      tags: [Platform admin]
      summary: List Organizations awaiting approval
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/OrganizationStatus' }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '4XX': { $ref: '#/components/responses/Error4xx' }
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationPage' }
  /admin/organizations/{organizationId}/decision:
    post:
      tags: [Platform admin]
      summary: Approve or reject an Organization
      parameters:
        - name: organizationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrganizationDecisionRequest' }
      responses:
        '4XX': { $ref: '#/components/responses/Error4xx' }
        '200':
          description: Decided; the Owner is notified by email
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organization' }

  /venues:
    get:
      tags: [Venues]
      summary: List the active Organization's Venues
      responses:
        '4XX': { $ref: '#/components/responses/Error4xx' }
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Venue' }
    post:
      tags: [Venues]
      summary: Create a Venue with an empty Seat Map
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VenueInput' }
      responses:
        '4XX': { $ref: '#/components/responses/Error4xx' }
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Venue' }

  /venues/{venueId}:
    parameters:
      - $ref: '#/components/parameters/VenueId'
    get:
      tags: [Venues]
      summary: Read a Venue
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Venue' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Venues]
      summary: Update a Venue
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VenueInput' }
      responses:
        '4XX': { $ref: '#/components/responses/Error4xx' }
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Venue' }
    delete:
      tags: [Venues]
      summary: Delete a Venue
      responses:
        '204': { description: Deleted }
        '409':
          description: Referenced by a published Event
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /venues/{venueId}/seat-map:
    parameters:
      - $ref: '#/components/parameters/VenueId'
    get:
      tags: [Venues]
      summary: Read a Venue's Seat Map
      responses:
        '4XX': { $ref: '#/components/responses/Error4xx' }
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeatMap' }
    put:
      tags: [Venues]
      summary: Replace a Venue's Seat Map
      description: |
        The whole map is replaced in one request. Editing a 2,000-seat map is a bulk edit, and
        a single atomic replacement is simpler to reason about than a stream of granular
        operations. Editing a Seat Map never affects an Event that is already published.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SeatMap' }
      responses:
        '200':
          description: Replaced
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeatMap' }
        '422':
          description: Duplicate seat labels, or seats sharing a position
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /events:
    get:
      tags: [Events]
      summary: List the active Organization's Events
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/EventStatus' }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '4XX': { $ref: '#/components/responses/Error4xx' }
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventPage' }
    post:
      tags: [Events]
      summary: Create an Event in Draft
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventInput' }
      responses:
        '4XX': { $ref: '#/components/responses/Error4xx' }
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }

  /events/{eventId}:
    parameters:
      - $ref: '#/components/parameters/EventId'
    get:
      tags: [Events]
      summary: Read an Event
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Events]
      summary: Update an Event
      description: |
        After publish, only title, description, images, listing and start time may change.
        Changing the start time notifies every ticket holder; `notifyCount` in the response
        states how many were notified.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventPatch' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '409':
          description: Field is frozen for a published Event
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /events/{eventId}/pricing-tiers:
    parameters:
      - $ref: '#/components/parameters/EventId'
    put:
      tags: [Events]
      summary: Set prices for the Event's Pricing Tiers
      description: |
        Tier names come from the Venue's Seat Map; this sets their prices. After publish, a
        price change applies only to later sales, never to existing Tickets or Seat Holds.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/PricingTierInput' }
      responses:
        '4XX': { $ref: '#/components/responses/Error4xx' }
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PricingTier' }

  /events/{eventId}/publish:
    parameters:
      - $ref: '#/components/parameters/EventId'
    post:
      tags: [Events]
      summary: Publish an Event
      description: |
        Copies the Venue's Seat Map into an immutable Event Seat Map and puts tickets on sale.
        Requires an approved Organization, a price for every tier in use, a future start time,
        and at least one sellable seat.
      responses:
        '200':
          description: Published
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '409':
          description: Preconditions not met
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /events/{eventId}/cover-uploads:
    parameters:
      - $ref: '#/components/parameters/EventId'
    post:
      tags: [Events]
      summary: Begin a cover image upload
      description: |
        Answers with everything needed to send one image straight to the system's object
        storage, and nothing about which storage that is: a URL to post a form to, the fields
        that form must carry, and a handle to confirm with afterwards. A client that reads the
        answer rather than the provider works against any of them (ADR-0006, and ADR-0002 for
        the same rule applied to payments).

        The upload it authorises is narrow on purpose. The key is chosen here, so a caller
        cannot write anywhere else in the store; the fields cap the size and require an image
        content type; and it expires in minutes. Nothing uploaded is reachable, or is the
        Event's cover, until `PUT /events/{eventId}/cover` accepts it.
      responses:
        '201':
          description: Upload authorised
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CoverUpload' }
        '409':
          description: The Event can no longer be changed
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /events/{eventId}/cover:
    parameters:
      - $ref: '#/components/parameters/EventId'
    put:
      tags: [Events]
      summary: Make an uploaded image the Event's cover
      description: |
        Checks what actually arrived and adopts it. The upload went straight to storage, so
        this is the first moment the system has seen the bytes: the content type a client
        declared is a claim, and the file's own leading bytes are the answer. An upload that
        is not an image is refused and discarded rather than served.

        Replacing a cover removes the one it replaced. The Event's `coverImageUrl` is written
        here and is read-only everywhere else.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CoverConfirmation' }
      responses:
        '200':
          description: Cover set
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '409':
          description: |
            Nothing was uploaded against that handle, what arrived is not an image of a type
            we serve, or the Event can no longer be changed.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    delete:
      tags: [Events]
      summary: Remove the Event's cover
      description: |
        Clears `coverImageUrl` and deletes the stored image. An Event with no cover is the
        ordinary state, not a broken one - which is why removing is its own verb rather than
        a null in a patch.
      responses:
        '204':
          description: Removed
        '409':
          description: The Event can no longer be changed
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /events/{eventId}/close-sales:
    parameters:
      - $ref: '#/components/parameters/EventId'
    post:
      tags: [Events]
      summary: Stop new Orders; existing Tickets stay valid
      responses:
        '4XX': { $ref: '#/components/responses/Error4xx' }
        '200':
          description: Closed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }

  /events/{eventId}/orders:
    parameters:
      - $ref: '#/components/parameters/EventId'
    get:
      tags: [Refunds]
      summary: The Orders placed for an Event
      description: |
        The organizer's view, for an Owner or Manager. `GET /orders` is the buyer's own list
        and answers a different question; neither substitutes for the other.

        This is how a refund is reached. [008](../requirements/008-refunds-and-cancellation.md)
        criterion 1 puts refunding in the hands of an Owner or Manager, and an Owner who cannot
        find an Order cannot refund one. `refundRequired=true` narrows the list to the Orders
        holding money the platform should not keep.
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/OrderStatus' }
        - name: refundRequired
          in: query
          schema: { type: boolean }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '4XX': { $ref: '#/components/responses/Error4xx' }
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderPage' }

  /public/events:
    get:
      tags: [Public]
      security: []
      summary: Public listing of events across Organizations
      description: |
        Published, listed Events of approved Organizations that have not yet started, ordered
        by start time. No ranking, relevance or personalization.

        A sold-out Event still appears. Hiding it would make the listing disagree with what is
        on, and somebody who missed it is better told so than left wondering.
      parameters:
        - name: q
          in: query
          description: |
            Filters by title. A filter and not a search ranking: matching Events are still
            ordered by start time, which is what keeps requirements/009 criterion 5 true.
            Matching is case-insensitive and accent-insensitive, so `hanoi` finds `Hà Nội`.
          schema: { type: string, maxLength: 200 }
        - name: city
          in: query
          schema: { type: string }
        - name: startsAfter
          in: query
          schema: { type: string, format: date-time }
        - name: startsBefore
          in: query
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '4XX': { $ref: '#/components/responses/Error4xx' }
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicEventPage' }
  /public/events/{eventId}:
    parameters:
      - $ref: '#/components/parameters/EventId'
    get:
      tags: [Public]
      security: []
      summary: Public Event page
      description: Reachable by link whatever the Event's listed status.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicEvent' }
        '404': { $ref: '#/components/responses/NotFound' }

  /public/events/{eventId}/seat-map:
    parameters:
      - $ref: '#/components/parameters/EventId'
    get:
      tags: [Public]
      security: []
      summary: The Event Seat Map with live availability
      responses:
        '4XX': { $ref: '#/components/responses/Error4xx' }
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventSeatMap' }

  /checkout:
    post:
      tags: [Checkout]
      summary: Begin checkout, taking Seat Holds
      description: |
        Creates a Seat Hold on each requested seat and an unpaid Order. Requires a verified
        email address: verification never happens inside a checkout, because the hold's clock
        would race the email round-trip.

        If any seat is unavailable the whole request fails and names the seats, so the client
        can preserve the rest of the selection.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckoutRequest' }
      responses:
        '201':
          description: Holds taken and Order created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '403':
          description: Email not verified
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '409':
          description: One or more seats unavailable; `details.seatIds` names them
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /orders:
    get:
      tags: [Checkout]
      summary: The signed-in User's Orders across all Organizations
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '4XX': { $ref: '#/components/responses/Error4xx' }
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderPage' }
  /orders/{orderId}:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      tags: [Checkout]
      summary: Read an Order
      description: |
        Readable by the buyer, and by the Organization selling the Event - the buyer to see
        what they bought, the Organization to answer a question about it at the door or to
        open the Order it is about to refund.

        Anyone else gets a 404 rather than a 403. Whether an Order exists is not a thing to
        confirm to a stranger holding a guessed id.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Checkout]
      summary: Abandon an unpaid Order, releasing its Seat Holds immediately
      responses:
        '204': { description: Abandoned }
        '409':
          description: Order is already paid
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /orders/{orderId}/payment-sessions:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    post:
      tags: [Checkout]
      summary: Start a payment attempt
      description: |
        Returns a provider-agnostic next action the client renders without knowing which
        provider produced it (ADR-0002). An Order may have many attempts and at most one
        success.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartPaymentRequest' }
      responses:
        '201':
          description: Session created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentSession' }
        '409':
          description: Order already paid, or its Seat Holds have expired
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /orders/{orderId}/resend-email:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    post:
      tags: [Tickets]
      summary: Re-send the Order email to the buyer
      responses:
        '4XX': { $ref: '#/components/responses/Error4xx' }
        '202': { description: Queued }

  /orders/{orderId}/tickets:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      tags: [Tickets]
      summary: The Tickets in an Order, each with its current Ticket Code
      responses:
        '4XX': { $ref: '#/components/responses/Error4xx' }
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Ticket' }

  /orders/{orderId}/refunds:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      tags: [Refunds]
      summary: The refund attempts against an Order
      responses:
        '4XX': { $ref: '#/components/responses/Error4xx' }
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Refund' }
    post:
      tags: [Refunds]
      summary: Refund a paid Order
      description: |
        Initiated by the Organization, never by the buyer. Like a payment, a refund is
        confirmed by the provider and is never an instant boolean - it returns
        `REFUND_PENDING` and settles later (ADR-0002).

        Refused if any Ticket in the Order has been redeemed: somebody has already been let
        in, and no refund can take that back.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefundRequest' }
      responses:
        '4XX': { $ref: '#/components/responses/Error4xx' }
        '202':
          description: Refund started
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Refund' }
        '409':
          description: |
            `ORDER_NOT_REFUNDABLE`: the Order is not paid, has already been refunded, or one
            of its Tickets has been redeemed. The three are one refusal because they end in
            the same place - there is nothing here to give back - and the message says which.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /events/{eventId}/cancel:
    parameters:
      - $ref: '#/components/parameters/EventId'
    post:
      tags: [Refunds]
      summary: Cancel an Event, voiding every Ticket and refunding every paid Order
      description: |
        A bulk operation that will partially fail, so it reports per-Order status rather than
        succeeding or failing as a whole. Poll the same path with GET to watch it settle.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefundRequest' }
      responses:
        '4XX': { $ref: '#/components/responses/Error4xx' }
        '202':
          description: Cancellation started
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventCancellation' }
        '409':
          description: |
            `EVENT_NOT_CANCELLABLE`: the Event was never published, or is already cancelled.
            A Draft has sold nothing and admits nobody, so there is nothing for a cancellation
            to undo - deleting it is the operation that was wanted.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    get:
      tags: [Refunds]
      summary: How a cancellation is going, per Order
      responses:
        '4XX': { $ref: '#/components/responses/Error4xx' }
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventCancellation' }

  /webhooks/payments/{provider}:
    parameters:
      - name: provider
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Webhooks]
      security: []
      summary: Provider payment confirmation
      description: |
        Authenticity is verified before the payload is trusted. Handling is idempotent: the
        same delivery twice produces one paid Order and one set of Tickets. Deliveries that
        arrive out of order, or for an unknown or already-settled session, are acknowledged
        and ignored rather than treated as errors.

        The buyer returning to the site never confirms an Order; only this does.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookPayload' }
      responses:
        '204': { description: Acknowledged }
        '401': { description: Signature verification failed }

  /events/{eventId}/scans:
    parameters:
      - $ref: '#/components/parameters/EventId'
    post:
      tags: [Admission]
      summary: Present a Ticket Code at the door
      description: |
        The single admission endpoint. Authorisation is checked against live Membership here,
        not against token claims, so a removed Gate Staff member stops being able to scan
        immediately (ADR-0005).

        Every attempt is recorded whatever the outcome. Concurrent scans of the same code
        result in exactly one redemption. There is no override: a refused Ticket cannot be
        admitted.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScanRequest' }
      responses:
        '200':
          description: |
            The scan was processed. `outcome` says whether the person is admitted; a refusal
            is a successful request, not an HTTP error.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScanResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { description: Rate limit exceeded for this device }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 15-minute access token. The active Organization is a claim within it.

  parameters:
    VenueId:
      name: venueId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EventId:
      name: eventId
      in: path
      required: true
      schema: { type: string, format: uuid }
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }

  responses:
    Error4xx:
      description: |
        The request failed. `code` says why, from the closed `ErrorCode` enum, so that
        clients branch on a value rather than on prose.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Tokens:
      description: Signed in
      content:
        application/json:
          schema: { $ref: '#/components/schemas/TokenPair' }
    Unauthorized:
      description: Not authenticated
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: Authenticated but not permitted
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Not found
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Conflict:
      description: Conflicts with current state
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Invalid:
      description: Request failed validation
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  schemas:
    Error:
      type: object
      description: |
        The single error envelope used by every failure response. One shape, so that clients
        parse errors once.
      required: [code, message]
      properties:
        code: { $ref: '#/components/schemas/ErrorCode' }
        message: { type: string, description: 'Human-readable, safe to display' }
        details:
          type: object
          additionalProperties: true
          description: Machine-readable specifics, e.g. `seatIds` for an unavailable-seat conflict

    ErrorCode:
      type: string
      enum:
        - VALIDATION_FAILED
        - NOT_AUTHENTICATED
        - EMAIL_NOT_VERIFIED
        - NOT_PERMITTED
        - NOT_FOUND
        - ORGANIZATION_NOT_APPROVED
        - LAST_OWNER
        - ALREADY_EXISTS
        - SEATS_UNAVAILABLE
        - HOLD_EXPIRED
        - EVENT_FIELD_FROZEN
        - PUBLISH_PRECONDITION_FAILED
        - CAPACITY_BELOW_SOLD
        - ORDER_ALREADY_PAID
        - ORDER_NOT_REFUNDABLE
        - EVENT_NOT_CANCELLABLE
        - VENUE_IN_USE
        - DUPLICATE_SEAT_LABEL
        - COVER_NOT_UPLOADED
        - COVER_NOT_AN_IMAGE
        - RATE_LIMITED

    CoverUpload:
      type: object
      description: |
        A form to post one image to, described rather than named. `url` and `fields` are
        whatever the store requires; a client copies every field into a multipart form, adds
        the file last under the name in `fileField`, and posts it. Reading the answer instead
        of knowing the provider is what keeps this contract free of one.
      required: [uploadId, url, fields, fileField, expiresAt]
      properties:
        uploadId:
          type: string
          description: Handle to confirm with. Meaningless to anything but this system.
        url: { type: string, format: uri }
        fields:
          type: object
          additionalProperties: { type: string }
          description: |
            Sent as form fields, in the order given, before the file. They carry the
            authorisation and the conditions it was signed under - the key, the size ceiling
            and the required content type - so altering any of them invalidates the upload.
        fileField:
          type: string
          description: The form field name the file itself goes under.
        maxBytes:
          type: integer
          format: int64
          description: |
            The ceiling the upload was signed with, so a client can refuse a file it already
            knows is too large rather than sending it and being told.
        expiresAt: { type: string, format: date-time }

    CoverConfirmation:
      type: object
      required: [uploadId]
      properties:
        uploadId: { type: string }
        alt:
          type: [string, 'null']
          maxLength: 200
          description: |
            What the picture shows. Asked for here, at the moment somebody is looking at the
            image they just chose, rather than left to a field they will never come back to.

    Money:
      type: object
      description: |
        Integer amount in the currency's smallest unit. VND has no minor unit, so the amount
        is the dong.

        `int64` is not caution: an Order for 2,000 seats at 2,000,000 VND is 4x10^9, past the
        range a 32-bit integer can carry, and a generator that reads an unformatted `integer`
        as 32-bit would make a sold-out event unrepresentable.
      required: [amount, currency]
      properties:
        amount: { type: integer, format: int64, minimum: 0 }
        currency: { type: string, enum: [VND] }

    Page:
      type: object
      properties:
        nextCursor:
          type: [string, 'null']
          description: Absent or null when there are no further pages

    TokenPair:
      type: object
      required: [accessToken, refreshToken, expiresIn]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer, description: Access token lifetime in seconds }
        activeOrganizationId: { type: [string, 'null'], format: uuid }

    Role:
      type: string
      enum: [OWNER, MANAGER, GATE_STAFF]

    OrganizationStatus:
      type: string
      enum: [PENDING_APPROVAL, APPROVED, REJECTED]

    EventStatus:
      type: string
      enum: [DRAFT, PUBLISHED, SALES_CLOSED, COMPLETED, CANCELLED]

    Me:
      type: object
      required: [id, email, displayName, emailVerified, memberships]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        emailVerified: { type: boolean }
        platformAdmin: { type: boolean }
        memberships:
          type: array
          items: { $ref: '#/components/schemas/Membership' }

    Organization:
      type: object
      required: [id, name, status]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        status: { $ref: '#/components/schemas/OrganizationStatus' }
        createdAt: { type: string, format: date-time }
        owners:
          type: array
          description: |
            Who is accountable for this Organization (requirements/001 criterion 6).

            An approval decides who may sell tickets to the public on a page this platform
            endorses, and a name and a date is not enough to decide that on. A list rather than
            one owner because an Organization may have several - at the moment it is decided it
            has exactly the person who created it, and that stops being true later.

            Seen only by a platform administrator and by the Organization's own creator, which
            is why it can carry an address at all.
          items: { $ref: '#/components/schemas/OrganizationOwner' }
        decisionReason:
          type: [string, 'null']
          description: |
            Why an Organization was rejected, in the words the administrator sent its owners.

            It was already written and already emailed; not carrying it here meant the queue of
            rejected Organizations was a list of names with no record of why any of them was
            rejected, including to the administrator who rejected them.

            Null for an Organization awaiting a decision, and for an approved one - approving
            needs no explanation and the field is cleared, so a reason never outlives the
            rejection it belonged to.

    OrganizationOwner:
      type: object
      required: [displayName, email, emailVerified]
      properties:
        displayName: { type: string }
        email: { type: string, format: email }
        emailVerified:
          type: boolean
          description: |
            Whether they have proved they can read that address. An unverified owner is not a
            reason to refuse on its own, and it is a thing an administrator should be able to
            see before endorsing somebody.

    Membership:
      type: object
      required: [userId, organizationId, role]
      properties:
        userId: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        organizationName: { type: string }
        email: { type: string, format: email }
        displayName: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        organizationStatus:
          allOf:
            - $ref: '#/components/schemas/OrganizationStatus'
          description: |
            Where this Organization stands (requirements/001 criterion 16). Present on the
            Memberships in `/me`, which is where a client learns what it may offer: an
            Organization that is not `APPROVED` cannot publish, and a person who cannot see
            that reads a refusal at publish time as the product being broken.

            On the Membership rather than behind an endpoint of its own, because every client
            that needs it has already asked for `/me` - and one that has several Memberships
            needs the standing of each in order to say which of them can sell.
        decisionReason:
          type: [string, 'null']
          description: |
            Why a `REJECTED` Organization was rejected, in the administrator's own words
            (requirements/001 criterion 6). Null for any other status.

            Shown to the Organization's own members as well as emailed to the Owner, because
            the email is the copy that gets lost - and a rejection nobody can re-read is one
            nobody can act on.

    VenueInput:
      type: object
      required: [name, city, timezone]
      properties:
        name: { type: string, maxLength: 200 }
        address: { type: string, maxLength: 500 }
        city:
          type: string
          maxLength: 100
          description: A field of its own, because the public listing filters on it
        timezone: { type: string, examples: ['Asia/Ho_Chi_Minh'] }

    Venue:
      allOf:
        - $ref: '#/components/schemas/VenueInput'
        - type: object
          required: [id]
          properties:
            id: { type: string, format: uuid }
            seatCount: { type: integer }

    SeatMapSeat:
      type: object
      required: [label, x, y, tierName]
      properties:
        label: { type: string, maxLength: 20, description: Unique within the Seat Map }
        x:
          type: number
          description: |
            Position across the room, in seat pitches. **One unit is roughly one seat**: the
            distance between neighbours in a row is 1, and an aisle is the extra unit you leave
            between them.

            The unit is otherwise arbitrary - a Seat Map has no real-world dimensions and a
            renderer fits whatever it is given to whatever box it has - but the *scale* is not,
            because a seat is drawn at a fixed size in these units. Space seats twenty units
            apart and the map is technically valid and renders as sixty specks in an empty
            room, which is a mistake nothing here can catch and nobody makes twice.
        y:
          type: number
          description: Position up the room, in the same units as `x`. Rows are 1 apart.
        tierName: { type: string, maxLength: 50 }

    MapElement:
      type: object
      description: Never ticketed. Exists so a buyer can orient themselves.
      required: [kind, x, y]
      properties:
        kind: { type: string, enum: [STAGE, ENTRANCE, AISLE, BAR, LABEL] }
        label: { type: string, maxLength: 50 }
        x: { type: number }
        y: { type: number }
        width: { type: number }
        height: { type: number }

    SeatMap:
      type: object
      required: [seats, elements]
      properties:
        seats:
          type: array
          items: { $ref: '#/components/schemas/SeatMapSeat' }
        elements:
          type: array
          items: { $ref: '#/components/schemas/MapElement' }

    PricingTier:
      type: object
      description: |
        A Pricing Tier as it stands, which may be a name with no price yet.

        Tier names come from a Seat Map, prices are set separately, and the gap between the
        two is a real state rather than an error: a tier is named the moment a seat is drawn
        into it, and priced whenever somebody gets round to it. Publishing is refused until
        every tier in use has a price (requirements/003 criterion 3), so an editor has to be
        able to see which ones are still missing - which is exactly what a null price says.
      required: [name, price]
      properties:
        name: { type: string }
        price:
          description: Null while the tier is named on the Seat Map but not yet priced.
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'

    PricingTierInput:
      type: object
      description: |
        Setting a price, where null means nothing. A separate schema from `PricingTier`
        because the two directions genuinely differ: a response reports the unpriced state,
        and a request that tried to send it would be asking to unprice a tier, which is not
        an operation this API has.
      required: [name, price]
      properties:
        name: { type: string }
        price: { $ref: '#/components/schemas/Money' }

    EventInput:
      type: object
      required: [title, venueId, startsAt]
      properties:
        title: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 5000 }
        venueId: { type: string, format: uuid }
        startsAt: { type: string, format: date-time }
        doorsOpenAt:
          type: [string, 'null']
          format: date-time
          description: |
            When admission begins. Optional while the Event is a Draft; publishing requires it,
            along with `endsAt` (requirements/003 criterion 16).
        endsAt:
          type: [string, 'null']
          format: date-time
          description: When admission closes. Required to publish; must be after `startsAt`.
        coverImageAlt:
          type: [string, 'null']
          maxLength: 200
          description: |
            What the cover shows, for somebody who cannot see it. Written by the organizer,
            because nobody else knows: a title repeated beside the picture it describes is
            what a screen reader reads twice, and is worse than the empty alt an undescribed
            image gets.
        listed: { type: boolean, default: true }

    EventPatch:
      type: object
      description: Only fields permitted for the Event's current status may be present.
      properties:
        title: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 5000 }
        coverImageAlt: { type: [string, 'null'], maxLength: 200 }
        startsAt: { type: string, format: date-time }
        doorsOpenAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        listed: { type: boolean }
        unsellableSeatIds:
          type: array
          items: { type: string, format: uuid }

    Event:
      allOf:
        - $ref: '#/components/schemas/EventInput'
        - type: object
          required: [id, status, organizationId]
          properties:
            id: { type: string, format: uuid }
            organizationId: { type: string, format: uuid }
            status: { $ref: '#/components/schemas/EventStatus' }
            coverImageUrl:
              type: [string, 'null']
              format: uri
              readOnly: true
              description: |
                Where the Event's cover is served from. Written by `PUT /events/{eventId}/cover`
                and cleared by `DELETE` on the same path - never by a patch, because the bytes
                and the reference are one thing and a client that could set this could point an
                Event at a picture nobody checked (ADR-0006).
            publishedAt: { type: [string, 'null'], format: date-time }
            pricingTiers:
              type: array
              items: { $ref: '#/components/schemas/PricingTier' }
            soldCount: { type: integer }
            salesTotal:
              allOf:
                - $ref: '#/components/schemas/Money'
              description: |
                Money currently held for this Event (requirements/003 criterion 23): the sum
                of its Orders that are paid and not refunded.

                Held, not ever taken. A refunded Order has given the money back, and counting
                it here would tell an organizer they hold funds they do not.

                Computed here rather than by a client because a client cannot: seats sit in
                different Pricing Tiers, a price change after publishing applies only to later
                sales, and refunds remove Orders from the total. Any sum attempted from
                `soldCount` and the tier prices would be a plausible wrong number.

                Absent for a caller who may not see sales figures - Gate Staff, per
                requirements/007 criterion 13.
            refundRequiredCount:
              type: integer
              description: |
                Orders on this Event holding money that should be given back. It sits on the
                Event because that is where an organizer looks, and a flag nobody can find is
                the same as no flag.
            notifyCount:
              type: integer
              description: Ticket holders notified by the request that produced this response

    PublicEventSummary:
      type: object
      required: [id, title, organizationName, venueName, city, startsAt, timezone,
                 seatsTotal, seatsAvailable]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        organizationName: { type: string }
        venueName: { type: string }
        city: { type: string }
        startsAt: { type: string, format: date-time }
        timezone: { type: string }
        coverImageUrl:
          type: [string, 'null']
          format: uri
          description: |
            The cover, at the largest size there is. Use this when not choosing between the
            sizes below - it is always a real image, where `coverImageSizes` may be empty.
        coverImageAlt: { type: [string, 'null'] }
        coverImageSizes:
          type: array
          description: |
            Smaller renderings of the same picture, smallest first, so a client can fetch the
            one it will actually draw (requirements/003 criterion 22). A listing drawing a
            140px band has no use for a poster.

            Data rather than a ready-made `srcset` string: an HTML attribute is one client's
            way of expressing this, and building it from these two fields is a join.

            May be empty, and that is not a failure. Nothing larger than the upload is
            produced, so a small upload has no smaller sizes; and a format the system cannot
            decode is served as it arrived rather than refused, because a size that could not
            be made should cost a visitor bandwidth and not a picture.
          items: { $ref: '#/components/schemas/CoverImageSize' }
        priceFrom: { $ref: '#/components/schemas/Money' }
        seatsTotal:
          type: integer
          minimum: 0
          description: |
            Seats the Event has for sale at all, so a client can say how nearly gone it is
            rather than only how many are left. "Four seats left" means something different in
            a room of twenty and a room of two thousand, and without this a client has to
            pick one meaning and be wrong about the other.

            Not a capacity figure and not attendance: seats an organizer has marked as not
            for sale are not counted, because they were never available to anybody.
        seatsAvailable:
          type: integer
          minimum: 0
          description: |
            Seats still on sale. Zero means sold out, which is the one thing here that changes
            a decision before anybody taps.

            A count rather than a flag because it publishes nothing new: the Event's seat map
            is already public and anybody may count it. What this saves is a request per Event,
            and it lets a client say how few are left without a second contract change. Held
            seats count as unavailable - a hold expires, but a buyer told "one left" who then
            finds none has been misled by a technicality.

    CoverImageSize:
      type: object
      required: [url, width]
      properties:
        url: { type: string, format: uri }
        width:
          type: integer
          minimum: 1
          description: The rendering's width in pixels, which is what a client picks by.

    PublicEvent:
      allOf:
        - $ref: '#/components/schemas/PublicEventSummary'
        - type: object
          properties:
            description: { type: string }
            status: { $ref: '#/components/schemas/EventStatus' }
            doorsOpenAt:
              type: [string, 'null']
              format: date-time
              description: When to turn up. Rendered in the Venue's timezone, like every time here.
            endsAt: { type: [string, 'null'], format: date-time }
            pricingTiers:
              type: array
              items: { $ref: '#/components/schemas/PricingTier' }

    SeatAvailability:
      type: string
      enum: [AVAILABLE, HELD, SOLD, NOT_FOR_SALE]

    EventSeat:
      type: object
      required: [id, label, x, y, tierName, availability]
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
        x: { type: number }
        y: { type: number }
        tierName: { type: string }
        availability: { $ref: '#/components/schemas/SeatAvailability' }

    EventSeatMap:
      type: object
      description: Frozen at publish. Availability is live.
      required: [seats, elements]
      properties:
        seats:
          type: array
          items: { $ref: '#/components/schemas/EventSeat' }
        elements:
          type: array
          items: { $ref: '#/components/schemas/MapElement' }

    OrderStatus:
      type: string
      description: |
        `CANCELLED` is a buyer abandoning an unpaid Order; `REFUNDED` is money given back.
        Collapsing the two would lose the distinction that matters most in a ledger.
      enum: [AWAITING_PAYMENT, PAID, EXPIRED, CANCELLED, REFUNDED]

    Order:
      type: object
      required: [id, eventId, status, total]
      properties:
        id: { type: string, format: uuid }
        eventId: { type: string, format: uuid }
        eventTitle: { type: string }
        status: { $ref: '#/components/schemas/OrderStatus' }
        total: { $ref: '#/components/schemas/Money' }
        seats:
          type: array
          items: { $ref: '#/components/schemas/OrderSeat' }
        holdExpiresAt:
          type: [string, 'null']
          format: date-time
          description: When the Seat Holds lapse. Null once the Order is paid.
        buyerEmail:
          type: string
          format: email
          description: |
            Where the tickets went. On an organizer's list it is the person a refund is about
            and who they will have to answer to; on a buyer's own Order it is their own
            address.
        refundRequired:
          type: boolean
          description: |
            Money taken for seats that were not delivered. Two ways to get here, and they are
            the same state: a payment confirmed after the Seat Holds had already lapsed
            ([005](../requirements/005-payment.md) criterion 10), or a refund the provider
            reported settled and then reversed
            ([008](../requirements/008-refunds-and-cancellation.md) criterion 11).

            The second is the worse one to be in, because the buyer has already been told they
            were refunded — but it is not a different flag. Both mean this Order is holding
            money it should not, and both want the same person to look at it.

            Set by the system and cleared by a refund. Nothing acted on it in v1, which is a
            state the platform could reach and not leave, and half the reason
            [008](../requirements/008-refunds-and-cancellation.md) was brought forward.
        createdAt: { type: string, format: date-time }

    NextAction:
      type: object
      description: |
        What the client must do next. Rendered without knowing which provider produced it.
      required: [type]
      properties:
        type: { type: string, enum: [REDIRECT, DISPLAY_QR, HOSTED_CHECKOUT, NONE] }
        url: { type: [string, 'null'], format: uri }
        qrPayload: { type: [string, 'null'] }
        reference:
          type: [string, 'null']
          description: Transfer memo the buyer must include, for QR bank transfers

    PaymentSession:
      type: object
      required: [id, orderId, status, nextAction]
      properties:
        id: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        provider: { type: string }
        status: { type: string, enum: [AWAITING_PAYMENT, PAID, FAILED, EXPIRED] }
        nextAction: { $ref: '#/components/schemas/NextAction' }
        expiresAt: { type: string, format: date-time }

    RefundStatus:
      type: string
      description: |
        Never a boolean. A refund is confirmed by the provider, like a payment, and the
        pending state is a real state somebody has to be able to see (ADR-0002).
      enum: [REFUND_PENDING, REFUNDED, REFUND_FAILED]

    RefundRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          maxLength: 500
          description: |
            Shown to the buyer in the email they receive. Required, because "your order was
            refunded" with no reason generates the support request it was meant to avoid.

    Refund:
      type: object
      required: [id, orderId, amount, status]
      properties:
        id: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        amount: { $ref: '#/components/schemas/Money' }
        status: { $ref: '#/components/schemas/RefundStatus' }
        reason: { type: string }
        failureReason:
          type: [string, 'null']
          description: Present when the status is REFUND_FAILED, so somebody can act on it.
        createdAt: { type: string, format: date-time }
        settledAt: { type: [string, 'null'], format: date-time }

    OrderRefundState:
      type: object
      required: [orderId, status]
      properties:
        orderId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/RefundStatus' }
        failureReason: { type: [string, 'null'] }

    EventCancellation:
      type: object
      description: |
        The progress of one cancellation. It exists because a bulk refund partially fails and
        somebody has to see which Orders did - a single success or failure for the whole
        operation would hide exactly the information needed to finish it by hand.
      required: [eventId, startedAt, orders]
      properties:
        eventId: { type: string, format: uuid }
        reason: { type: string }
        startedAt: { type: string, format: date-time }
        pending: { type: integer }
        refunded: { type: integer }
        failed: { type: integer }
        orders:
          type: array
          items: { $ref: '#/components/schemas/OrderRefundState' }

    Ticket:
      type: object
      required: [id, orderId, eventId, status]
      properties:
        id: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        eventId: { type: string, format: uuid }
        seatLabel: { type: [string, 'null'], description: Null for general admission }
        tierName: { type: [string, 'null'] }
        status: { type: string, enum: [VALID, REDEEMED, VOID] }
        ticketCode:
          type: string
          description: |
            The current code only. Reissuing invalidates the previous one. Carries no
            information: seat and validity are resolved server-side at scan time.
        redeemedAt: { type: [string, 'null'], format: date-time }

    ScanOutcome:
      type: string
      description: |
        Every outcome is distinct, so the door can be told what actually happened.

        `EVENT_NOT_OPEN` and `EVENT_ENDED` are judged against the Event's admission window -
        `doorsOpenAt` to `endsAt` - never against its start time.
      enum:
        - ADMITTED
        - ALREADY_REDEEMED
        - WRONG_EVENT
        - TICKET_VOID
        - EVENT_NOT_OPEN
        - EVENT_ENDED
        - UNKNOWN_CODE

    ScanResult:
      type: object
      required: [outcome, message]
      properties:
        outcome: { $ref: '#/components/schemas/ScanOutcome' }
        message: { type: string, description: Readable at arm's length }
        seatLabel: { type: [string, 'null'] }
        tierName: { type: [string, 'null'] }
        firstRedeemedAt:
          type: [string, 'null']
          format: date-time
          description: |
            Present when the outcome is ALREADY_REDEEMED, with `firstRedeemedDeviceId`. The
            two together are how staff tell "you already went in" from "someone else used
            your ticket".
        firstRedeemedDeviceId: { type: [string, 'null'] }

    WebhookPayload:
      type: object
      additionalProperties: true
      description: |
        The provider's raw payload. Deliberately unconstrained: each provider defines its
        own shape, and the adapter for that provider is what interprets it.

    OrderSeat:
      type: object
      properties:
        seatId: { type: string, format: uuid }
        label: { type: string }
        tierName: { type: string }
        price: { $ref: '#/components/schemas/Money' }
    RegisterRequest:
      type: object
      required: [email, password, displayName]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 12 }
        displayName: { type: string, maxLength: 100 }
    VerifyEmailRequest:
      type: object
      required: [token]
      properties:
        token: { type: string }
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    ResetPasswordRequest:
      type: object
      required: [token, password]
      properties:
        token: { type: string }
        password: { type: string, minLength: 12 }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }
    SwitchOrganizationRequest:
      type: object
      required: [organizationId]
      properties:
        organizationId: { type: string, format: uuid }
    CreateOrganizationRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 200 }
    InviteMemberRequest:
      type: object
      required: [email, role]
      properties:
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
    ChangeMemberRoleRequest:
      type: object
      required: [role]
      properties:
        role: { $ref: '#/components/schemas/Role' }
    OrganizationDecisionRequest:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [APPROVED, REJECTED] }
        reason: { type: string, maxLength: 1000 }
    CheckoutRequest:
      type: object
      required: [eventId, seatIds]
      properties:
        eventId: { type: string, format: uuid }
        seatIds:
          type: array
          minItems: 1
          items: { type: string, format: uuid }
    StartPaymentRequest:
      type: object
      required: [provider]
      properties:
        provider: { type: string, examples: [FAKE, STRIPE] }
    ScanRequest:
      type: object
      required: [ticketCode, deviceId]
      properties:
        ticketCode: { type: string }
        deviceId: { type: string, maxLength: 100 }
    OrganizationPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Organization' }
    EventPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Event' }
    PublicEventPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/PublicEventSummary' }
    OrderPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Order' }
